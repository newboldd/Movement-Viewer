<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement Viewer</title>
    <link rel="stylesheet" href="/static/css/main.css?v=18">
</head>
<body>
    <div class="viewer-outer">

        <!-- Video canvas (no top nav bar — controls live at the bottom). -->
        <div class="viewer-viewport">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Bottom controls -->
        <div class="viewer-controls">

            <!-- Timeline + transport -->
            <div class="timeline-row">
                <button class="btn btn-sm" id="prevFrameBtn" title="Prev frame (A/←)" disabled>&#8592;</button>
                <button class="btn btn-sm" id="playBtn"     title="Play/Pause (Space)" disabled>&#9654;</button>
                <button class="btn btn-sm" id="nextFrameBtn" title="Next frame (S/→)" disabled>&#8594;</button>
                <div class="timeline-wrap" id="timelineWrap">
                    <input type="range" id="timelineSlider" min="0" max="1000" value="0" disabled>
                    <div id="trimUI" style="display:none;">
                        <div id="trimTrack"></div>
                        <input type="range" id="trimStart" class="trim-slider" min="0" max="1000" value="0">
                        <input type="range" id="trimEnd"   class="trim-slider" min="0" max="1000" value="1000">
                    </div>
                </div>
                <span class="frame-counter">
                    <strong id="timeDisplay">0:00.00</strong>
                    / <strong id="totalTimeDisplay">0:00.00</strong>
                    <span class="counter-sep">|</span>
                    <span class="frame-block">Frame <strong id="frameDisplay">0</strong></span>
                    / <strong id="totalFramesDisplay">0</strong>
                </span>
            </div>

            <!-- Playback -->
            <div class="playback-row">
                <label id="stereoLabel" title="Treat the loaded video as side-by-side stereo (auto-detected on load)"
                       style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);">
                    <input type="checkbox" id="stereoCheckbox" style="margin:0;" disabled> Stereo
                </label>
                <button class="btn btn-sm" id="sideToggle"  title="Switch camera (E)" disabled>OS | OD</button>
                <button class="btn btn-sm" id="resetZoomBtn" title="Reset zoom (Z)" disabled>Reset Zoom</button>

                <div class="speed-wrap">
                    <label>Speed</label>
                    <input type="range" id="speedSlider" min="0" max="13" value="6" disabled>
                    <span id="speedDisplay">1x</span>
                </div>

                <div class="divider"></div>

                <button class="btn btn-sm" id="exportBtn" onclick="toggleExportMode()" disabled>Export Video</button>
                <button class="btn btn-sm" id="exportCancelBtn" style="display:none;" onclick="exitExportMode()">Cancel</button>
                <button class="btn btn-sm" id="addSpeedBtn"
                        title="Queue the current speed for the next export.  Up to 4 speeds export from a single capture in parallel."
                        style="display:none;">Add speed</button>
                <span id="exportSpeedTags"
                      style="display:none;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);"></span>
                <span id="exportFrameStampRow"
                      style="display:none;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);margin-left:6px;">
                    <label title="Burn the source-video frame number into every exported frame (top-right corner)"
                           style="display:inline-flex;align-items:center;gap:3px;cursor:pointer;">
                        <input type="checkbox" id="stampFrameNumber" style="margin:0;"> Frame #
                    </label>
                    <label title="Burn the elapsed seconds-since-start-of-export into every exported frame (bottom-right corner)"
                           style="display:inline-flex;align-items:center;gap:3px;cursor:pointer;">
                        <input type="checkbox" id="stampTime" style="margin:0;"> Time
                    </label>
                </span>
                <span id="exportStatus"></span>

                <div class="spacer"></div>

                <div class="recent-picker" id="recentPicker">
                    <button class="btn btn-sm recent-toggle" id="recentToggleBtn"
                            type="button" title="Recently loaded videos" disabled>
                        <span class="recent-label" id="recentLabel">No recent videos</span>
                        <span class="recent-caret">▾</span>
                    </button>
                    <div class="recent-panel" id="recentPanel" hidden></div>
                </div>

                <button class="btn btn-sm" id="browseBtn" title="Open any video file">Load Video</button>
                <input type="file" id="browseInput" accept="video/*" style="display:none;">
            </div>
        </div>

    </div>

    <script src="/static/js/viewer.js?v=36"></script>
</body>
</html>
